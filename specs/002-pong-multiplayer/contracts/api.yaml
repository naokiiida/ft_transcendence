openapi: 3.1.0
info:
  title: ft_transcendence API
  description: REST API for Pong multiplayer platform
  version: 1.0.0
  contact:
    name: ft_transcendence Team

servers:
  - url: https://pong.taiida.com
    description: Production server

tags:
  - name: Auth
    description: Authentication endpoints (email/password + 42 OAuth)
  - name: Users
    description: User profile and management
  - name: Friends
    description: Friend requests and lists
  - name: Games
    description: Game history and stats
  - name: Tournaments
    description: Tournament management
  - name: Matchmaking
    description: Quick match queue
  - name: System
    description: Health and metrics

paths:
  # =============================================================================
  # Authentication
  # =============================================================================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=abc123; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited (5 failed attempts)

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=; Max-Age=0

  /api/auth/oauth/42:
    get:
      tags: [Auth]
      summary: Initiate 42 OAuth flow
      responses:
        '302':
          description: Redirect to 42 authorization page

  /api/auth/oauth/42/callback:
    get:
      tags: [Auth]
      summary: Handle 42 OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to home page with session cookie
        '400':
          description: Invalid state or code
        '503':
          description: 42 OAuth API unavailable

  # =============================================================================
  # Users
  # =============================================================================
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user profile by ID
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '404':
          description: User not found

    patch:
      tags: [Users]
      summary: Update user profile (own profile only)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Cannot update other users' profiles

  /api/users/{id}/avatar:
    post:
      tags: [Users]
      summary: Upload avatar image
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: PNG/JPG/GIF, max 2MB
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: string
        '400':
          description: Invalid file (too large or wrong format)

  /api/users/{id}/games:
    get:
      tags: [Users]
      summary: Get user's match history
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Match history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHistoryResponse'

  # =============================================================================
  # Friends
  # =============================================================================
  /api/friends:
    get:
      tags: [Friends]
      summary: Get friend list
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Friend list with online status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsListResponse'

  /api/friends/requests:
    get:
      tags: [Friends]
      summary: Get pending friend requests
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Pending requests (sent and received)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestsResponse'

    post:
      tags: [Friends]
      summary: Send friend request
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Friend request sent
        '400':
          description: Cannot friend yourself
        '409':
          description: Request already exists

  /api/friends/requests/{id}:
    patch:
      tags: [Friends]
      summary: Accept or decline friend request
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, decline]
      responses:
        '200':
          description: Request updated
        '404':
          description: Request not found

  /api/friends/{id}:
    delete:
      tags: [Friends]
      summary: Remove friend
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Friend removed

  # =============================================================================
  # Games
  # =============================================================================
  /api/games/{id}:
    get:
      tags: [Games]
      summary: Get game details
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'

  /api/games/ai:
    post:
      tags: [Games]
      summary: Start AI game
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty]
              properties:
                difficulty:
                  type: string
                  enum: [easy, medium, hard]
      responses:
        '201':
          description: AI game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCreatedResponse'

  # =============================================================================
  # Matchmaking
  # =============================================================================
  /api/matchmaking/join:
    post:
      tags: [Matchmaking]
      summary: Join matchmaking queue
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Joined queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  position:
                    type: integer
                  estimated_wait_seconds:
                    type: integer
        '409':
          description: Already in queue
        '503':
          description: Queue full (max 100)

  /api/matchmaking/leave:
    post:
      tags: [Matchmaking]
      summary: Leave matchmaking queue
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Left queue

  # =============================================================================
  # Tournaments
  # =============================================================================
  /api/tournaments:
    get:
      tags: [Tournaments]
      summary: List tournaments
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, ready, in_progress, completed]
      responses:
        '200':
          description: Tournament list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentsListResponse'

    post:
      tags: [Tournaments]
      summary: Create tournament
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTournamentRequest'
      responses:
        '201':
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'

  /api/tournaments/{id}:
    get:
      tags: [Tournaments]
      summary: Get tournament details with bracket
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/tournamentId'
      responses:
        '200':
          description: Tournament details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetailResponse'

  /api/tournaments/{id}/join:
    post:
      tags: [Tournaments]
      summary: Join tournament
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/tournamentId'
      responses:
        '200':
          description: Joined tournament
        '400':
          description: Tournament not open
        '409':
          description: Already joined or tournament full

  /api/tournaments/{id}/leave:
    post:
      tags: [Tournaments]
      summary: Leave tournament (before started)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/tournamentId'
      responses:
        '200':
          description: Left tournament
        '400':
          description: Tournament already started

  /api/tournaments/{id}/start:
    post:
      tags: [Tournaments]
      summary: Start tournament (creator only)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/tournamentId'
      responses:
        '200':
          description: Tournament started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetailResponse'
        '400':
          description: Need exactly 4 or 8 players
        '403':
          description: Not tournament creator

  # =============================================================================
  # System
  # =============================================================================
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus format metrics
          content:
            text/plain:
              schema:
                type: string

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    tournamentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # --- Auth ---
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 1
          maxLength: 32

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    # --- User ---
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        intra_username:
          type: string
          nullable: true
        elo_rating:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        created_at:
          type: string
          format: date-time

    PublicUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        elo_rating:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        is_online:
          type: boolean

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9_ ]+$'

    # --- Friends ---
    FriendsListResponse:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/PublicUserResponse'

    FriendRequestsResponse:
      type: object
      properties:
        received:
          type: array
          items:
            $ref: '#/components/schemas/FriendRequest'
        sent:
          type: array
          items:
            $ref: '#/components/schemas/FriendRequest'

    FriendRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/PublicUserResponse'
        created_at:
          type: string
          format: date-time

    # --- Games ---
    GameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        player1:
          $ref: '#/components/schemas/PublicUserResponse'
        player2:
          $ref: '#/components/schemas/PublicUserResponse'
        player1_score:
          type: integer
        player2_score:
          type: integer
        winner_id:
          type: string
          format: uuid
          nullable: true
        game_type:
          type: string
          enum: [quick, tournament, ai]
        status:
          type: string
          enum: [waiting, playing, completed, forfeit]
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true

    GameCreatedResponse:
      type: object
      properties:
        game_id:
          type: string
          format: uuid
        ws_url:
          type: string
          description: WebSocket URL to join game

    GameHistoryResponse:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # --- Tournaments ---
    CreateTournamentRequest:
      type: object
      required: [name, max_players]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        max_players:
          type: integer
          enum: [4, 8, 16]

    TournamentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        creator:
          $ref: '#/components/schemas/PublicUserResponse'
        max_players:
          type: integer
        current_players:
          type: integer
        status:
          type: string
          enum: [open, ready, in_progress, completed]
        created_at:
          type: string
          format: date-time

    TournamentDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TournamentResponse'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/PublicUserResponse'
            matches:
              type: array
              items:
                $ref: '#/components/schemas/TournamentMatch'
            winner:
              $ref: '#/components/schemas/PublicUserResponse'
              nullable: true

    TournamentMatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        round:
          type: integer
        match_index:
          type: integer
        player1:
          $ref: '#/components/schemas/PublicUserResponse'
          nullable: true
        player2:
          $ref: '#/components/schemas/PublicUserResponse'
          nullable: true
        winner_id:
          type: string
          format: uuid
          nullable: true
        games_won_p1:
          type: integer
        games_won_p2:
          type: integer
        status:
          type: string
          enum: [pending, ready, in_progress, completed]

    TournamentsListResponse:
      type: object
      properties:
        tournaments:
          type: array
          items:
            $ref: '#/components/schemas/TournamentResponse'

    # --- Errors ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
